<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agent Dashboard - IT Service Desk</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .navbar {
            background-color: #1864ab;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout {
            color: white;
            text-decoration: none;
            background-color: #dc3545;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .container {
            width: 80%;
            margin: 40px auto;
        }

        .welcome,
        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .info {
            margin: 12px 0;
            font-size: 17px;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            background-color: #1864ab;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-right: 10px;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <h2>IT Service Desk</h2>

        <a href="{{ url_for('user_controller.logout') }}"
           class="logout">
            Logout
        </a>

    </div>


    <div class="container">

        <div class="welcome">

            <h1>Agent Dashboard</h1>

            <p>
                Welcome, <strong>{{ name }}</strong>
            </p>

        </div>


        <div class="card">

            <h3>Account Information</h3>

            <div class="info">
                <strong>Name:</strong> {{ name }}
            </div>

            <div class="info">
                <strong>Email:</strong> {{ email }}
            </div>

            <div class="info">
                <strong>Role:</strong> {{ role }}
            </div>

            <div class="info">
                <strong>Status:</strong> Active
            </div>

        </div>


        <div class="card">

            <h3>Agent Services</h3>

            <a href="#" class="button">
                Assigned Tickets
            </a>

            <a href="#" class="button">
                Resolved Tickets
            </a>

        </div>

    </div>

</body>

</html>
