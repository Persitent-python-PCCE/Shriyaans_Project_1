<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agent Login | IT Service Desk</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #eef4ff;
        }

        .card {
            width: 400px;
            max-width: 92%;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,.12);
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
        }

        h2 {
            text-align: center;
            color: #364fc7;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #364fc7;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            background: #fde2e2;
            color: #c62828;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
        }

        .links {
            text-align: center;
            margin-top: 22px;
            line-height: 2;
        }

        a {
            color: #364fc7;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>IT Service Desk</h1>

    <h2>Agent Login</h2>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form
        method="POST"
        action="{{ url_for('user_controller.agent_login') }}"
    >

        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Agent Login
        </button>

    </form>

    <div class="links">

        <div>
            Employee?
            <a href="{{ url_for('user_controller.employee_login') }}">
                Employee Login
            </a>
        </div>

        <!-- <div>
            Administrator?
            <a href="{{ url_for('user_controller.admin_login') }}">
                Admin Login
            </a>
        </div> -->

    </div>

</div>

</body>
</html>
