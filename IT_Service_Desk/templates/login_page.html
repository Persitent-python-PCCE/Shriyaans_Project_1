<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT Service Desk</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #91b8e0;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 400px;

            background-color: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #555;

            margin-bottom: 30px;
        }

        .error {
            background-color: #ffe5e5;

            color: #c00;

            padding: 10px;

            margin-bottom: 15px;

            border-radius: 5px;
        }

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 5px;

            font-size: 16px;
        }

        input,
        select {

            width: 100%;

            padding: 10px;

            box-sizing: border-box;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 16px;
        }

        select {
            background-color: white;

            cursor: pointer;
        }

        button {

            width: 100%;

            margin-top: 20px;

            padding: 12px;

            border: none;

            border-radius: 5px;

            background-color: #007bff;

            color: white;

            cursor: pointer;

            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .link {

            text-align: center;

            margin-top: 20px;

            font-size: 16px;
        }

        .link a {

            color: #007bff;

            text-decoration: none;
        }

        .link a:hover {

            text-decoration: underline;
        }

    </style>

</head>


<body>

<div class="container">


    {% if register %}

        

        <h1>IT Service Desk</h1>

        <h2>Create Account</h2>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form
            action="{{ url_for('user_controller.register') }}"
            method="POST"
        >

             

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >


             

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


             

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

 

            <label for="role_id">
                Register As
            </label>

            <select
                id="role_id"
                name="role_id"
                required
            >

                <option value="">
                    Select your role
                </option>

                <option value="1">
                    Employee
                </option>

                <option value="2">
                    Agent
                </option>

                <option value="3">
                    Admin
                </option>

            </select>


            

            <button type="submit">
                Register
            </button>

        </form>


        <!-- LOGIN LINK -->

        <div class="link">

            Already have an account?

            <a href="{{ url_for('user_controller.login') }}">
                Login
            </a>

        </div>


    {% else %}

 
        <h1>IT Service Desk</h1>

        <h2>Login</h2>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form
            action="{{ url_for('user_controller.login') }}"
            method="POST"
        >

            <!-- EMAIL -->

            <label for="login_email">
                Email
            </label>

            <input
                type="email"
                id="login_email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <!-- PASSWORD -->

            <label for="login_password">
                Password
            </label>

            <input
                type="password"
                id="login_password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <!-- LOGIN BUTTON -->

            <button type="submit">
                Login
            </button>

        </form>


        <!-- REGISTER LINK -->

        <div class="link">

            Don't have an account?

            <a href="{{ url_for('user_controller.register') }}">
                Register
            </a>

        </div>


    {% endif %}


</div>

</body>

</html>
