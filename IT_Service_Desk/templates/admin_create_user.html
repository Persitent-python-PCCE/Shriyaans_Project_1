<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User | Admin</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }
        .container {
            width: 92%;
            max-width: 700px;
            margin: 50px auto;
        }
        .card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }
        h1 {
            margin-top: 0;
        }
        .subtitle {
            color: #667085;
            margin-bottom: 25px;
        }
        .error {
            background: #fde2e2;
            color: #c62828;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin: 17px 0 7px;
            font-weight: bold;
        }
        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 7px;
            font-size: 15px;
        }
        input:focus,
        select:focus {
            outline: none;
            border-color: #087f5b;
        }
        .password-message {
            margin-top: 7px;
            font-size: 13px;
            color: #c62828;
            display: none;
        }
        .password-message.valid {
            color: #198754;
        }
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }
        button,
        a {
            flex: 1;
            padding: 12px;
            border-radius: 7px;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }
        button {
            border: none;
            background: #087f5b;
            color: white;
        }
        .cancel {
            background: #e9ecef;
            color: #343a40;
        }
        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }
            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Create User Account</h1>
        <p class="subtitle">Register a new Employee or Support Agent.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_user.create_user') }}" onsubmit="return validatePasswords()">
            <label>Full Name</label>
            <input type="text" name="name" value="{{ name|default('') }}" required>

            <label>Email</label>
            <input type="email" name="email" value="{{ email|default('') }}" required>

            <label>Password</label>
            <input type="password" id="password" name="password" required>

            <label>Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>

            <div id="password-message" class="password-message">
                Passwords do not match.
            </div>

            <label>Account Type</label>
            <select name="role_name" required>
                <option value="">Select account type</option>
                <option value="EMPLOYEE" {% if role_name|default('') == 'EMPLOYEE' %}selected{% endif %}>Employee</option>
                <option value="AGENT" {% if role_name|default('') == 'AGENT' %}selected{% endif %}>Support Agent</option>
            </select>

            <div class="buttons">
                <a href="{{ url_for('admin_user.manage_users') }}" class="cancel">Cancel</a>
                <button type="submit">Create Account</button>
            </div>
        </form>
    </div>
</div>

<script>
function validatePasswords() {
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm_password").value;
    const message = document.getElementById("password-message");

    if (password !== confirmPassword) {
        message.style.display = "block";
        message.classList.remove("valid");
        return false;
    }

    message.style.display = "block";
    message.classList.add("valid");
    message.textContent = "Passwords match.";
    return true;
}

document.getElementById("confirm_password").addEventListener("input", function () {
    const password = document.getElementById("password").value;
    const confirmPassword = this.value;
    const message = document.getElementById("password-message");

    if (!confirmPassword) {
        message.style.display = "none";
        return;
    }

    if (password === confirmPassword) {
        message.style.display = "block";
        message.classList.add("valid");
        message.textContent = "Passwords match.";
    } else {
        message.style.display = "block";
        message.classList.remove("valid");
        message.textContent = "Passwords do not match.";
    }
});
</script>
</body>
</html>
