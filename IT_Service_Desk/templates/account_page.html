<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>IT Service Desk - Accounts</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;

            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;

            background-color: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;

            border-bottom: 1px solid #ddd;

            text-align: left;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        .logout {
            display: inline-block;

            margin-bottom: 20px;

            padding: 10px 15px;

            background-color: #dc3545;

            color: white;

            text-decoration: none;

            border-radius: 5px;
        }

        .logout:hover {
            background-color: #b02a37;
        }

    </style>

</head>

<body>

<div class="container">

    <a
        class="logout"
        href="{{ url_for('user_controller.logout') }}"
    >
        Logout
    </a>

    <h1>IT Service Desk Users</h1>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role ID</th>
                <th>Status</th>
            </tr>

        </thead>

        <tbody>

            {% for user in users %}

            <tr>

                <td>{{ user.id }}</td>

                <td>{{ user.name }}</td>

                <td>{{ user.email }}</td>

                <td>{{ user.role_id }}</td>

                <td>
                    {% if user.is_active %}
                        Active
                    {% else %}
                        Inactive
                    {% endif %}
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>

</html>
