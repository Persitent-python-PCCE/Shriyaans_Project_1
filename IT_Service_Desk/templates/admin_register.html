<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Admin | IT Service Desk</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f1f3f5;
        }

        .card {
            width: 420px;
            max-width: 92%;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,.12);
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        .notice {
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .error {
            background: #fde2e2;
            color: #c62828;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 7px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #343a40;
            color: white;
            font-size: 16px;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #343a40;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>IT Service Desk</h1>

    <h2>Create Administrator</h2>

    <div class="notice">
        This page is only available when no administrator
        account exists in the system.
    </div>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form
        method="POST"
        action="{{ url_for('user_controller.admin_register') }}"
    >

        <label>
            Name
        </label>

        <input
            type="text"
            name="name"
            required
        >

        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Create Administrator
        </button>

    </form>

    <div class="link">

        <a href="{{ url_for('user_controller.admin_login') }}">
            Back to Admin Login
        </a>

    </div>

</div>

</body>
</html>
