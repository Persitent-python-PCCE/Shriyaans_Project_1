<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Ticket - IT Service Desk</title>


    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .navbar {
            background-color: #087f5b;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-button {
            color: white;
            text-decoration: none;
            background-color: #066b4d;
            padding: 10px 16px;
            border-radius: 6px;
        }

        .logout {
            color: white;
            text-decoration: none;
            background-color: #dc3545;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .container {
            width: 70%;
            margin: 40px auto;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .card h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea,
        select {

            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            border: 1px solid #ced4da;

            border-radius: 6px;

            font-size: 15px;

            font-family: Arial, sans-serif;

        }

        input:focus,
        textarea:focus,
        select:focus {

            outline: none;

            border-color: #087f5b;

        }

        textarea {

            resize: vertical;

            min-height: 160px;

        }

        .row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

        }

        .help-text {

            font-size: 13px;

            color: #777;

            margin-top: 6px;

        }

        .error {

            background-color: #f8d7da;

            color: #842029;

            padding: 14px;

            border-radius: 6px;

            margin-bottom: 20px;

        }

        .actions {

            display: flex;

            gap: 12px;

            margin-top: 30px;

        }

        .button {

            border: none;

            padding: 12px 22px;

            background-color: #087f5b;

            color: white;

            text-decoration: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 15px;

        }

        .cancel-button {

            background-color: #6c757d;

        }

        @media (max-width: 700px) {

            .container {
                width: 94%;
            }

            .navbar {
                padding: 15px 20px;
            }

            .row {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

    <div class="navbar">

        <h2>IT Service Desk</h2>


        <div class="nav-links">

            <a href="{{ url_for('user_controller.employee_dashboard') }}"
               class="nav-button">

                Dashboard

            </a>


            <a href="{{ url_for('user_controller.logout') }}"
               class="logout">

                Logout

            </a>

        </div>

    </div>


    <div class="container">

        <div class="card">

            <h1>Create Support Ticket</h1>

            <p class="subtitle">

                Describe the technical issue you are facing.
                Our support team will review your ticket.

            </p>


            {% if error %}

                <div class="error">
                    {{ error }}
                </div>

            {% endif %}


            <form method="POST"
                  action="{{ url_for('ticket_controller.create_ticket') }}">


                <!-- TITLE -->

                <div class="form-group">

                    <label for="title">
                        Ticket Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        maxlength="200"
                        placeholder="Example: Unable to connect to office Wi-Fi"
                        required
                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Problem Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe the issue in detail..."
                        required
                    ></textarea>

                    <div class="help-text">

                        Include error messages, when the problem started,
                        and any troubleshooting steps you already tried.

                    </div>

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="category_id">
                        Category
                    </label>


                    <select
                        id="category_id"
                        name="category_id"
                        required
                    >

                        <option value="">
                            -- Select Category --
                        </option>


                        {% for category in categories %}

                            <option value="{{ category.id }}">

                                {{ category.name }}

                                {% if category.description %}
                                    - {{ category.description }}
                                {% endif %}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- PRIORITY + SEVERITY -->

                <div class="row">


                    <div class="form-group">

                        <label for="priority">
                            Priority
                        </label>


                        <select
                            id="priority"
                            name="priority"
                            required
                        >

                            {% for value in priority_options %}
                            <option value="{{ value }}" {% if value == "MEDIUM" %}selected{% endif %}>
                                {{ value|replace('_', ' ')|title }}
                            </option>
                            {% endfor %}

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="severity">
                            Severity
                        </label>


                        <select
                            id="severity"
                            name="severity"
                            required
                        >

                            {% for value in severity_options %}
                            <option value="{{ value }}" {% if value == "MODERATE" %}selected{% endif %}>
                                {{ value|replace('_', ' ')|title }}
                            </option>
                            {% endfor %}

                        </select>

                    </div>

                </div>


                <!-- BUTTONS -->

                <div class="actions">

                    <button
                        type="submit"
                        class="button"
                    >

                        Create Ticket

                    </button>


                    <a
                        href="{{ url_for('ticket_controller.my_tickets') }}"
                        class="button cancel-button"
                    >

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
